<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1PACTE Planning Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Fond posé avant même la feuille de style : pas d'éclair blanc au rechargement. -->
<style>html{background-color:#D6DCEE}</style>
</head>
<body>
<!-- Squelette affiché jusqu'au premier rendu (remplacé par main.js). -->
<div id="app" aria-busy="true">
  <div class="rail"><div class="in">
    <img class="logo" src="/logo-96.png" alt="1pacte" width="44" height="44">
    <div><h1>1PACTE Planning Dashboard</h1><div class="sb">Chargement…</div></div>
    <div class="sk sk-nav skeleton"></div>
  </div></div>
  <section class="sheet skeleton">
    <div class="sk sk-title"></div>
    <div class="sk sk-sub"></div>
    <div class="sk-board">
      <div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>
      <div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>
      <div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>
    </div>
    <p class="sk-note">Lecture du planning depuis Linear…</p>
  </section>
</div>
<div id="key-overlay" class="overlay" hidden></div>
<aside class="drw" id="drw" aria-hidden="true">
  <header><h3 id="dwT">Détail</h3><button class="x" id="dwX" aria-label="Fermer">×</button></header>
  <div class="bd" id="dwB"></div>
</aside>
<div class="tip" id="tip"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
